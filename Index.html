<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengaduan Masyarakat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5fa;--sf:#fff;--tx:#12203f;--mu:#586279;--pr:#0b2a5b;--pt:#fff;--ac:#f5a524;--at:#12203f;--bd:#d9dfec;--ok:#16794a;--wr:#a85a00;--er:#b3261e;--in:#1d5fd1;--pu:#7a3fc4;--hl:#eaf0fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0c1426;--sf:#142039;--tx:#e8ecf6;--mu:#a1abc2;--pr:#8db4ff;--pt:#0c1426;--ac:#f5b441;--bd:#27355a;--ok:#4cc58a;--wr:#f0a04b;--er:#ff8a80;--in:#7ab0ff;--pu:#c3a0f5;--hl:#1a2a4d}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1426;--sf:#142039;--tx:#e8ecf6;--mu:#a1abc2;--pr:#8db4ff;--pt:#0c1426;--ac:#f5b441;--bd:#27355a;--ok:#4cc58a;--wr:#f0a04b;--er:#ff8a80;--in:#7ab0ff;--pu:#c3a0f5;--hl:#1a2a4d}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
a{color:var(--pr)}h1,h2,h3{line-height:1.25;margin:0 0 .5em}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:9}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{font-weight:700;color:var(--pr);text-decoration:none;font-size:1.05rem;margin-right:auto}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--mu);font-size:.9rem;white-space:nowrap;font-weight:500}
nav a[aria-current=page]{background:var(--hl);color:var(--pr)}
main{padding:24px 0 48px;min-height:70vh}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px}
.btn{display:inline-block;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 18px;border-radius:10px;font:600 .95rem Poppins,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.a{background:var(--ac);color:var(--at);border-color:var(--ac)}.btn.p{background:var(--pr);color:var(--pt);border-color:var(--pr)}.btn.d{color:var(--er);border-color:var(--er)}.btn.s{padding:5px 12px;font-size:.85rem}
.hero{background:var(--pr);color:var(--pt);border-radius:16px;padding:40px 24px;margin-bottom:20px}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);max-width:18ch}.hero p{max-width:52ch;opacity:.92;margin:0 0 20px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.st b{display:block;font-size:2rem;color:var(--pr);line-height:1.2}.st span{color:var(--mu);font-size:.9rem}
.step{display:flex;gap:12px}.step i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--hl);color:var(--pr);display:grid;place-items:center;font-style:normal;font-weight:700}
.step p{margin:0;color:var(--mu);font-size:.9rem}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,currentColor 14%,transparent)}
.s0{color:var(--in)}.s1{color:var(--pu)}.s2{color:var(--wr)}.s3{color:var(--ok)}.s4{color:var(--er)}
.m{color:var(--mu);font-size:.85rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}.ck{display:flex;gap:8px;align-items:center;margin:14px 0 0}.ck label{margin:0}
.er{color:var(--er);font-size:.82rem;min-height:1em}
.tl{list-style:none;margin:16px 0 0;padding:0 0 0 18px;border-left:2px solid var(--bd)}
.tl li{position:relative;margin-bottom:16px;padding-left:12px}.tl li::before{content:"";position:absolute;left:-26px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--pr);border:3px solid var(--sf)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.row>*{flex:1 1 160px;width:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.bar{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}.bar div{height:12px;background:var(--hl);border-radius:6px;overflow:hidden}.bar div i{display:block;height:100%;background:var(--pr)}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(560px,94vw);padding:20px}dialog::backdrop{background:#0008}
.ok{border-color:var(--ok)}.tk{font-size:1.5rem;font-weight:700;color:var(--pr);letter-spacing:.02em}
footer{border-top:1px solid var(--bd);padding:18px 0;color:var(--mu);font-size:.85rem;text-align:center}
</style></head><body>
<header><div class="w hd"><a class="brand" href="#beranda">Pengaduan Masyarakat</a>
<nav id="nav" aria-label="Menu utama"></nav><button class="btn s" id="th" aria-label="Ganti tema">Tema</button></div></header>
<main class="w" id="app"></main>
<footer><div class="w">Layanan Pengaduan Pemerintah Kelurahan. Data pada situs ini adalah contoh dan tersimpan di peramban Anda.</div></footer>
<dialog id="dlg"></dialog>
<script>
const CATS=['Infrastruktur','Kebersihan','Keamanan','Pelayanan Publik','Lingkungan','Lainnya'];
const ST=['Diterima','Diverifikasi','Diproses','Selesai','Ditolak'];
const PIC=['','Dinas PU','Dishub','Dinas Lingkungan Hidup','Satpol PP','Petugas Layanan'];
const USERS={admin:{p:'admin123',r:'Super Admin'},petugas:{p:'petugas123',r:'Petugas'}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=x=>new Date(x).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const tid=(d,n)=>'ADU-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-'+String(n).padStart(4,'0');
const badge=s=>`<span class="b s${ST.indexOf(s)}">${s}</span>`;
function seed(){const T=[
['Infrastruktur','Jalan berlubang di Jl. Melati','Lubang cukup dalam dan membahayakan pengendara motor, terutama saat malam hari.','RT 03/RW 02, Jl. Melati',2,'Diproses','Dinas PU'],
['Kebersihan','Sampah menumpuk di TPS','Sampah tidak diangkut lebih dari seminggu dan menimbulkan bau menyengat.','TPS Kelurahan Sukamaju',5,'Diterima',''],
['Keamanan','Lampu jalan mati','Beberapa titik lampu jalan padam sehingga rawan tindak kejahatan.','Jl. Kenanga No. 10',9,'Diverifikasi','Dishub'],
['Pelayanan Publik','Antrean pengurusan KTP terlalu lama','Warga antre berjam-jam karena hanya satu loket yang dibuka.','Kantor Kelurahan',14,'Selesai','Petugas Layanan'],
['Lingkungan','Saluran air tersumbat','Air meluap ke jalan setiap hujan karena selokan penuh sampah dan lumpur.','Gang Mawar, RW 05',20,'Diproses','Dinas Lingkungan Hidup'],
['Infrastruktur','Jembatan penghubung rusak','Pagar jembatan patah dan papan lantai mulai lapuk.','Jembatan Kali Baru',33,'Selesai','Dinas PU'],
['Lainnya','Permintaan papan informasi layanan','Mohon dipasang papan informasi jam dan alur layanan di depan kantor.','Kantor Kelurahan',40,'Ditolak',''],
['Kebersihan','Sampah liar di lahan kosong','Warga luar membuang sampah di lahan kosong dekat taman bermain.','Lahan kosong Jl. Dahlia',50,'Selesai','Satpol PP']];
const now=Date.now(),day=864e5;
return T.map((t,i)=>{const cr=now-t[4]*day,path=t[5]==='Ditolak'?['Diterima','Ditolak']:ST.slice(0,ST.indexOf(t[5])+1);
return{id:tid(new Date(cr),i+1),name:i%3==2?'':'Warga',anon:i%3==2,contact:'',cat:t[0],title:t[1],body:t[2],loc:t[3],date:new Date(cr-day).toISOString().slice(0,10),created:cr,status:t[5],assigned:t[6],
resp:t[5]==='Diterima'?[]:[{t:cr+day,x:t[5]==='Ditolak'?'Permintaan belum dapat dipenuhi pada anggaran tahun ini.':'Laporan telah kami terima dan ditindaklanjuti petugas terkait.'}],
log:path.map((s,j)=>({s,d:cr+j*day}))}}).sort((a,b)=>b.created-a.created)}
let D,U=null,L={q:'',c:'',s:'',p:1},A={q:'',s:''};
try{const s=localStorage.getItem('pm_data');if(s)D=JSON.parse(s)}catch(e){}
if(!Array.isArray(D))D=seed();
const save=()=>{try{localStorage.setItem('pm_data',JSON.stringify(D))}catch(e){}};
const card=c=>`<article class="card"><div class="m">${esc(c.id)} &middot; ${fd(c.created)}</div><h3 style="font-size:1.05rem;margin:4px 0">${esc(c.title)}</h3><p class="m" style="margin:0 0 8px">${esc(c.cat)} &middot; ${esc(c.loc)} &middot; oleh ${c.anon?'Anonim':esc(c.name)}</p>${badge(c.status)}</article>`;
const pages={beranda,lapor,lacak,daftar,faq,admin};
function render(){const k=pages[location.hash.slice(1)]?location.hash.slice(1):'beranda';
$('#nav').innerHTML=[['beranda','Beranda'],['lapor','Buat Pengaduan'],['lacak','Lacak'],['daftar','Daftar Publik'],['faq','FAQ &amp; Kontak'],['admin','Admin']].map(([h,t])=>`<a href="#${h}" ${h===k?'aria-current="page"':''}>${t}</a>`).join('');
$('#app').innerHTML='';pages[k]();window.scrollTo(0,0)}
function beranda(){const n=s=>D.filter(c=>s.includes(c.status)).length;
$('#app').innerHTML=`<section class="hero"><h1>Suara warga, ditindaklanjuti terbuka.</h1><p>Sampaikan masalah jalan, sampah, keamanan, layanan publik, atau lingkungan di sekitar Anda. Pantau setiap langkah penanganannya dengan nomor tiket.</p><a class="btn a" href="#lapor">Buat Pengaduan</a> <a class="btn" href="#lacak" style="margin-left:6px">Lacak Tiket</a></section>
<div class="g"><div class="card st"><b>${D.length}</b><span>Total laporan</span></div><div class="card st"><b>${n(['Diterima','Diverifikasi','Diproses'])}</b><span>Sedang diproses</span></div><div class="card st"><b>${n(['Selesai'])}</b><span>Selesai ditangani</span></div></div>
<h2 style="margin-top:28px">Bagaimana laporan Anda ditangani</h2><div class="g">${[['Tulis','Isi form pengaduan dan lampirkan foto bukti.'],['Verifikasi','Petugas memeriksa kelengkapan dan kebenaran laporan.'],['Tindak lanjut','Laporan diteruskan ke dinas terkait untuk ditangani.'],['Selesai','Hasil penanganan ditampilkan pada tiket Anda.']].map((s,i)=>`<div class="card step"><i>${i+1}</i><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}</div>
<h2 style="margin-top:28px">Pengaduan terbaru</h2><div class="g">${D.slice(0,3).map(card).join('')}</div>`}
function lapor(){$('#app').innerHTML=`<h1>Buat pengaduan</h1><form class="card" id="f" novalidate>
<div class="ck"><input type="checkbox" id="anon" name="anon"><label for="anon">Kirim sebagai anonim</label></div>
<label for="name">Nama</label><input id="name" name="name" autocomplete="name"><div class="er" id="e-name"></div>
<label for="contact">No. HP atau email</label><input id="contact" name="contact"><div class="er" id="e-contact"></div>
<div class="row"><div><label for="cat">Kategori</label><select id="cat" name="cat"><option value="">Pilih kategori</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="er" id="e-cat"></div></div>
<div><label for="date">Tanggal kejadian</label><input type="date" id="date" name="date"><div class="er" id="e-date"></div></div></div>
<label for="title">Judul laporan</label><input id="title" name="title" maxlength="100"><div class="er" id="e-title"></div>
<label for="body">Isi laporan</label><textarea id="body" name="body" rows="5"></textarea><div class="er" id="e-body"></div>
<label for="loc">Lokasi kejadian</label><input id="loc" name="loc"><div class="er" id="e-loc"></div>
<label for="files">Foto bukti (maks. 3 file, masing-masing maks. 2 MB)</label><input type="file" id="files" accept="image/*" multiple><div class="er" id="e-files"></div>
<button class="btn a" style="margin-top:12px">Kirim pengaduan</button></form>`;
const f=$('#f');f.anon.onchange=()=>{f.name.disabled=f.anon.checked;if(f.anon.checked)f.name.value=''};
f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),er={},an=f.anon.checked;
if(!an&&!v.name.trim())er.name='Isi nama Anda, atau centang kirim sebagai anonim.';
if(!/^(\+?62|0)8\d{7,12}$/.test(v.contact.replace(/[\s-]/g,''))&&!/^\S+@\S+\.\S+$/.test(v.contact))er.contact='Masukkan no. HP (contoh 08123456789) atau email yang valid.';
if(!v.cat)er.cat='Pilih kategori laporan.';
if(!v.date||new Date(v.date)>new Date())er.date='Pilih tanggal kejadian, tidak boleh di masa depan.';
if(v.title.trim().length<8)er.title='Judul minimal 8 karakter.';
if(v.body.trim().length<30)er.body='Isi laporan minimal 30 karakter agar petugas dapat memahaminya.';
if(!v.loc.trim())er.loc='Tuliskan lokasi kejadian.';
const fl=[...f.files.files];if(fl.length>3)er.files='Maksimal 3 foto.';else if(fl.some(x=>!x.type.startsWith('image/')||x.size>2097152))er.files='Hanya file gambar dengan ukuran maksimal 2 MB.';
['name','contact','cat','date','title','body','loc','files'].forEach(k=>$('#e-'+k).textContent=er[k]||'');
const first=Object.keys(er)[0];if(first){const el=$('#'+first);if(el)el.focus();return}
const d=new Date(),pre=tid(d,0).slice(0,13),n=D.filter(c=>c.id.startsWith(pre)).length+1,id=tid(d,n);
D.unshift({id,name:an?'':v.name.trim(),anon:an,contact:v.contact.trim(),cat:v.cat,title:v.title.trim(),body:v.body.trim(),loc:v.loc.trim(),date:v.date,created:d.getTime(),status:'Diterima',assigned:'',resp:[],log:[{s:'Diterima',d:d.getTime()}],files:fl.map(x=>x.name)});save();
$('#app').innerHTML=`<div class="card ok"><h1>Pengaduan terkirim</h1><p>Simpan nomor tiket ini untuk memantau perkembangan laporan Anda.</p><div class="tk">${id}</div><p class="m">${an?'Laporan dikirim sebagai anonim dan kontak Anda tidak ditampilkan ke publik.':'Kontak Anda hanya dapat dilihat petugas.'}</p><a class="btn p" href="#lacak" onclick="sessionStorage&&0">Lacak tiket</a> <a class="btn" href="#beranda">Kembali ke beranda</a></div>`}}
function lacak(){$('#app').innerHTML=`<h1>Lacak pengaduan</h1><form class="card" id="tf"><label for="tn">Nomor tiket</label><div class="row"><input id="tn" placeholder="ADU-20261121-0001" autocomplete="off"><button class="btn p" style="flex:0 0 auto">Cari tiket</button></div><div id="tr"></div></form>`;
$('#tf').onsubmit=e=>{e.preventDefault();const id=$('#tn').value.trim().toUpperCase(),c=D.find(x=>x.id===id);
$('#tr').innerHTML=!c?`<p class="er">Tiket ${esc(id||'')} tidak ditemukan. Periksa kembali nomor tiket Anda.</p>`:
`<h2 style="font-size:1.2rem">${esc(c.title)}</h2><p class="m">${esc(c.cat)} &middot; ${esc(c.loc)}</p>${badge(c.status)}${c.assigned?` <span class="m">Ditangani: ${esc(c.assigned)}</span>`:''}
<ul class="tl">${c.log.map(l=>`<li><b>${l.s}</b><div class="m">${fd(l.d)}</div></li>`).join('')}</ul>
${c.resp.length?'<h3 style="font-size:1rem">Tanggapan resmi</h3>'+c.resp.map(r=>`<p style="margin:0 0 8px"><span class="m">${fd(r.t)}</span><br>${esc(r.x)}</p>`).join(''):'<p class="m">Belum ada tanggapan resmi.</p>'}`}}
function daftar(){$('#app').innerHTML=`<h1>Daftar pengaduan publik</h1><div class="row"><input id="q" type="search" placeholder="Cari judul atau lokasi" aria-label="Cari" value="${esc(L.q)}"><select id="c" aria-label="Kategori"><option value="">Semua kategori</option>${CATS.map(c=>`<option ${L.c===c?'selected':''}>${c}</option>`).join('')}</select><select id="s" aria-label="Status"><option value="">Semua status</option>${ST.map(c=>`<option ${L.s===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="res"></div>`;
const go=()=>{L.q=$('#q').value;L.c=$('#c').value;L.s=$('#s').value;L.p=1;draw()};['q','c','s'].forEach(i=>$('#'+i).oninput=go);draw()}
function draw(){const q=L.q.toLowerCase(),r=D.filter(c=>(!L.c||c.cat===L.c)&&(!L.s||c.status===L.s)&&(!q||(c.title+c.loc).toLowerCase().includes(q))),pg=Math.max(1,Math.ceil(r.length/6));L.p=Math.min(L.p,pg);
$('#res').innerHTML=r.length?`<div class="g">${r.slice((L.p-1)*6,L.p*6).map(card).join('')}</div><div class="row" style="margin-top:16px;align-items:center"><button class="btn s" id="pv" ${L.p<2?'disabled':''} style="flex:0 0 auto">Sebelumnya</button><span class="m" style="text-align:center">Halaman ${L.p} dari ${pg}</span><button class="btn s" id="nx" ${L.p>=pg?'disabled':''} style="flex:0 0 auto">Berikutnya</button></div>`:'<p class="card m">Tidak ada pengaduan yang cocok. Ubah kata kunci atau filter.</p>';
if(r.length){$('#pv').onclick=()=>{L.p--;draw()};$('#nx').onclick=()=>{L.p++;draw()}}}
function faq(){const Q=[['Siapa yang dapat membuat pengaduan?','Setiap warga. Anda boleh menyertakan identitas atau mengirim secara anonim.'],['Berapa lama laporan ditanggapi?','Laporan diverifikasi paling lambat 3 hari kerja sejak diterima.'],['Apakah data pribadi saya aman?','No. HP dan email hanya terlihat oleh petugas. Laporan anonim tidak menampilkan nama.'],['Laporan apa yang ditolak?','Laporan berisi ujaran kebencian, hoaks, iklan, atau di luar kewenangan kelurahan.']];
$('#app').innerHTML=`<h1>FAQ &amp; kontak</h1><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card">${Q.map(q=>`<details><summary>${q[0]}</summary><p class="m">${q[1]}</p></details>`).join('')}</div>
<div class="card"><h2 style="font-size:1.2rem">Hubungi kami</h2><p>Jam layanan: Senin&ndash;Jumat, 08.00&ndash;16.00 WIB<br>Alamat: Jl. Pelayanan No. 1, Kelurahan Sukamaju<br>Telepon: (021) 555-0123<br>Email: pengaduan@kelurahan.example</p></div></div>`}
function admin(){if(!U){$('#app').innerHTML=`<h1>Masuk panel admin</h1><form class="card" id="lf" style="max-width:380px"><label for="u">Nama pengguna</label><input id="u" autocomplete="username"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password"><div class="er" id="le"></div><button class="btn p" style="margin-top:8px">Masuk</button><p class="m">Akun contoh: admin / admin123 (Super Admin), petugas / petugas123 (Petugas).</p></form>`;
$('#lf').onsubmit=e=>{e.preventDefault();const a=USERS[$('#u').value.trim()];if(a&&a.p===$('#pw').value){U={n:$('#u').value.trim(),r:a.r};admin()}else $('#le').textContent='Nama pengguna atau kata sandi salah.'};return}
const cnt=(arr,fn)=>arr.map(l=>[l,D.filter(c=>fn(c)===l).length]),mx=a=>Math.max(1,...a.map(x=>x[1])),bars=a=>a.map(([l,n])=>`<div class="bar"><span>${l}</span><div><i style="width:${n/mx(a)*100}%"></i></div><b>${n}</b></div>`).join('');
const mo=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i,1);return d}),mk=d=>d.getFullYear()+'-'+d.getMonth();
const bm=mo.map(d=>[d.toLocaleDateString('id-ID',{month:'short'}),D.filter(c=>{const x=new Date(c.created);return mk(x)===mk(d)}).length]);
$('#app').innerHTML=`<div class="row" style="align-items:center"><h1 style="margin:0;flex:1 1 auto">Dashboard</h1><span class="m" style="flex:0 0 auto">${esc(U.n)} (${U.r})</span><button class="btn s" id="csv" style="flex:0 0 auto">Ekspor CSV</button><button class="btn s" id="lo" style="flex:0 0 auto">Keluar</button></div>
<div class="g">${cnt(ST,c=>c.status).map(([l,n])=>`<div class="card st"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
<div class="g" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Laporan per kategori</h3>${bars(cnt(CATS,c=>c.cat))}</div><div class="card"><h3>Laporan per bulan</h3>${bars(bm)}</div></div>
<h2 style="margin-top:24px">Kelola pengaduan</h2><div class="row"><input id="aq" type="search" placeholder="Cari tiket atau judul" aria-label="Cari" value="${esc(A.q)}"><select id="as" aria-label="Status"><option value="">Semua status</option>${ST.map(c=>`<option ${A.s===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="card tw" id="at"></div>`;
$('#lo').onclick=()=>{U=null;admin()};
$('#csv').onclick=()=>{const h=['Tiket','Tanggal','Kategori','Judul','Lokasi','Pelapor','Kontak','Status','Petugas'],q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',t=[h.map(q).join(',')].concat(D.map(c=>[c.id,fd(c.created),c.cat,c.title,c.loc,c.anon?'Anonim':c.name,c.anon?'':c.contact,c.status,c.assigned].map(q).join(','))).join('\n');
dlg.innerHTML=`<h2>Ekspor CSV</h2><p class="m">Salin teks di bawah lalu tempel ke berkas .csv atau Excel.</p><textarea id="ct" rows="8" readonly>${esc(t)}</textarea><div class="row" style="margin-top:12px"><button class="btn p" id="cp">Salin</button><button class="btn" id="cx">Tutup</button></div>`;dlg.showModal();$('#cx').onclick=()=>dlg.close();
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('#cp').textContent='Tersalin'}catch(e){$('#ct').select();$('#cp').textContent='Pilih semua, tekan Ctrl+C'}}};
const dr=()=>{A.q=$('#aq').value;A.s=$('#as').value;const q=A.q.toLowerCase(),r=D.filter(c=>(!A.s||c.status===A.s)&&(!q||(c.id+c.title).toLowerCase().includes(q)));
$('#at').innerHTML=r.length?`<table><thead><tr><th>Tiket</th><th>Judul</th><th>Status</th><th>Petugas</th><th></th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td>${esc(c.title)}<div class="m">${esc(c.cat)}</div></td><td>${badge(c.status)}</td><td>${esc(c.assigned)||'-'}</td><td><button class="btn s" data-id="${c.id}">Kelola</button></td></tr>`).join('')}</tbody></table>`:'<p class="m">Tidak ada data yang cocok.</p>';
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>manage(b.dataset.id,dr))};
$('#aq').oninput=dr;$('#as').oninput=dr;dr()}
function manage(id,done){const c=D.find(x=>x.id===id);
dlg.innerHTML=`<h2 style="font-size:1.2rem">${esc(c.title)}</h2><p class="m">${c.id} &middot; ${esc(c.cat)} &middot; ${esc(c.loc)}<br>Pelapor: ${c.anon?'Anonim':esc(c.name)+' ('+esc(c.contact)+')'}</p><p>${esc(c.body)}</p>${(c.files||[]).length?`<p class="m">Lampiran: ${c.files.map(esc).join(', ')}</p>`:''}
<div class="row"><div><label for="ms">Status</label><select id="ms">${ST.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label for="mp">Tugaskan ke</label><select id="mp">${PIC.map(s=>`<option value="${s}" ${s===c.assigned?'selected':''}>${s||'Belum ditugaskan'}</option>`).join('')}</select></div></div>
<label for="mr">Tanggapan resmi</label><textarea id="mr" rows="3" placeholder="Tulis tanggapan untuk pelapor"></textarea>
<div class="row" style="margin-top:14px"><button class="btn p" id="sv">Simpan perubahan</button>${U.r==='Super Admin'?'<button class="btn d" id="dl">Hapus laporan</button>':''}<button class="btn" id="cl">Tutup</button></div>`;dlg.showModal();
$('#cl').onclick=()=>dlg.close();
$('#sv').onclick=()=>{const s=$('#ms').value,r=$('#mr').value.trim(),now=Date.now();if(s!==c.status){c.log.push({s,d:now});c.status=s}c.assigned=$('#mp').value;if(r)c.resp.push({t:now,x:r});save();dlg.close();admin()};
if($('#dl'))$('#dl').onclick=function(){if(!this.dataset.a){this.dataset.a=1;this.textContent='Klik lagi untuk menghapus permanen';return}D=D.filter(x=>x.id!==id);save();dlg.close();admin()}}
const dlg=$('#dlg');
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',render);render();
</script></body></html>
